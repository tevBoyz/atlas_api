# CI for the Atlas API (API-100-04). Runs on every push and pull request, on all branches.
# Any failing step fails the run. No real credentials and no GitHub secrets: the database and Redis
# are throwaway local containers started from docker-compose.yml (same image and shim as local dev).
#
# Jobs
#   checks    install, lint, format check, typecheck, unit tests, baseline checksums, OpenAPI diff
#   database  the db:* scripts against docker compose (Postgres 17.11, Supabase image + local shim,
#             and Redis), then test:baseline and test:int, which start their own throwaway
#             containers through Testcontainers (API-100-13). The parity suite was retired with the
#             old SQL backend (D76).
#   dart      regenerates the Dart client, fails on any difference, analyzes and tests the package
#   docker    docker build of the Dockerfile (build only, nothing is pushed)
#   secrets   gitleaks (.gitleaks.toml + .gitleaksignore) on the commits this push / pull request adds
#
# Reproduce locally: see "CI" in README.md.

name: CI

on:
  push:
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch (or pull request) cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  # The local containers from docker-compose.yml (throwaway credentials, 127.0.0.1 only).
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/postgres
  REDIS_URL: redis://127.0.0.1:63799
  # Separate compose project so CI never shares names or volumes with a local `atlas-api` stack.
  COMPOSE_PROJECT_NAME: atlas-api-ci

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Baseline checksums
        run: npm run db:baseline:verify

      # AC3: regenerate openapi.json and fail on any difference from the committed file. The
      # `openapi:check` script is added by API-100-12; until then this step is skipped with a notice.
      - name: OpenAPI diff
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['openapi:check'] ? 0 : 1)"; then
            npm run openapi:check
          else
            echo "::notice title=OpenAPI diff skipped::package.json has no openapi:check script yet (added by API-100-12)."
          fi

  database:
    name: Database and integration tests
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Start Postgres 17.11 (Supabase image + local shim) and Redis
        run: docker compose up -d --wait

      - name: Apply database baseline
        run: npm run db:baseline

      - name: SQL behaviour tests
        run: npm run db:test:sql

      - name: API migrations
        run: npm run db:migrate

      - name: Seed fake data
        run: npm run db:seed

      # These suites start their own Postgres and Redis containers on random ports (API-100-13) and
      # ignore DATABASE_URL and REDIS_URL above.
      - name: SQL behaviour tests in a fresh container
        run: npm run test:baseline -- --ci

      - name: Integration tests
        run: npm run test:int -- --ci

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop services
        if: always()
        run: docker compose down -v

  dart:
    name: Dart client
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: 3.12.2

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Regenerate the client
        run: npm run client:dart:generate

      - name: Fail on any difference from the committed client
        run: |
          if [ -n "$(git status --porcelain -- clients/dart openapi.json)" ]; then
            git status --porcelain -- clients/dart openapi.json
            git diff -- clients/dart openapi.json
            echo "::error::clients/dart is out of date. Run npm run client:dart:generate and commit."
            exit 1
          fi

      - name: Analyze and test the package
        run: npm run client:dart:build

  docker:
    name: Docker build
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build only: no registry login, nothing is pushed.
      - name: Build image
        run: docker build --pull --build-arg GIT_COMMIT="$GITHUB_SHA" --tag atlas-api:ci .

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt (linux_x64). Update both lines together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Full history so the commit range of any push or pull request is available.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The gitleaks CLI (MIT), pinned by version and checksum. No license key, no GitHub secrets.
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # Scan only the commits this event adds:
      #   pull request   merge-base(base, head)..head
      #   push           before..after (a force push included, when `before` is still known)
      #   new branch, or a force push whose old tip is gone
      #                  merge-base(default branch, head)..head
      #   first push of the default branch (no usable `before`)
      #                  the whole history
      - name: Work out the commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          has_commit() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$(git merge-base "$PR_BASE" "$PR_HEAD" || echo "$PR_BASE")
            range="$base..$PR_HEAD"
          elif [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] && has_commit "$PUSH_BEFORE"; then
            range="$PUSH_BEFORE..$HEAD_SHA"
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ] && has_commit "origin/$DEFAULT_BRANCH" \
            && base=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA"); then
            range="$base..$HEAD_SHA"
          else
            range="$HEAD_SHA"
          fi
          echo "Scanning: $range ($(git rev-list --count "$range") commits)"
          echo "log_opts=$range" >> "$GITHUB_OUTPUT"

      # Default gitleaks rules extended by .gitleaks.toml (one reviewed commit allowlisted), plus
      # .gitleaksignore (exact fingerprints of reviewed findings in history). Both are read from the
      # repo root. The local throwaway values (postgres:postgres@127.0.0.1 etc.) are not flagged.
      - name: Scan for secrets
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: >-
          "$RUNNER_TEMP/gitleaks" git
          --log-opts="$LOG_OPTS"
          --redact
          --verbose
          --no-banner
          --exit-code 1
          .
