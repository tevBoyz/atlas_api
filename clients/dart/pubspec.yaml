name: atlas_api_client
description: Generated Dart client for the Atlas API. Do not edit lib/src/generated by hand.
# Always the API version (src/app.constants.ts, package.json). Checked by npm run client:dart:build.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  dio: ^5.11.1
  json_annotation: ^4.12.0
  retrofit: ^4.10.0

dev_dependencies:
  build_runner: 2.17.1
  json_serializable: 6.15.2
  lints: 6.1.0
  retrofit_generator: 10.3.3
  swagger_parser: 1.46.0
  test: 1.33.0
